spring.application.name=dreamwire

# Configuración MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/dreamwire_db
spring.datasource.username=dreamuser
spring.datasource.password=dreampass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Desactiva la consola H2 si ya no la usas
spring.h2.console.enabled=false
