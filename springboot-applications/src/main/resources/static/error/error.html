<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - DreamWire</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c3e50;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            color: #f39c12;
        }
        h2 {
            font-size: 2rem;
            margin: 1rem 0;
            color: #2c3e50;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 1rem 0;
            color: #34495e;
        }
        .error-details {
            background: rgba(243, 156, 18, 0.1);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin-top: 20px;
            background-color: #f39c12;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #d68910;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Error</h1>
        <h2>Ha ocurrido un error</h2>
        <p>Lo sentimos, algo no salió como esperábamos.</p>
        <div class="error-details">
            <p>Código de error: <span th:text="${status}">???</span></p>
            <p>Mensaje: <span th:text="${message}">Error desconocido</span></p>
        </div>
        <p>Por favor, intenta de nuevo más tarde o contacta con soporte si el problema persiste.</p>
        <a href="/" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
